<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  {% include header.html %}

  <main class="content two-column">

    <div class="main-column">
      {{ content }}
    </div>

    <div class="side-column">

      <section class="side-info">
        <h3 class="side-info-title">Remote telescope &amp; education</h3>
        <p class="side-info-text">
          Open-access astronomy education and remote observation with a roll-off roof observatory. Materials are free to use and adapt.
        </p>
      </section>

      <figure>
        <img
          src="{{ '/assets/images/home_image_1.jpg' | relative_url }}"
          alt="Observatory or astronomy education"
        >
      </figure>

      <figure>
        <img
          src="{{ '/assets/images/home_image_2.jpg' | relative_url }}"
          alt="Telescope or night-sky outreach"
        >
      </figure>

    </div>

  </main>

  {% include footer.html %}
</body>
</html>
